version: '3.8'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./patterns:/app/patterns:ro
    restart: unless-stopped

  # Optional Redis service for caching (uncomment to use)
  redis:
    image: redis:7
    restart: unless-stopped
